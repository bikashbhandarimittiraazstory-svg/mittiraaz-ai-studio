
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MittiRaaz AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#111827;color:white;font-family:Arial,sans-serif}
.container{max-width:750px;margin:auto}
h1{color:#fbbf24;text-align:center}
.card{background:#1f2937;padding:16px;border-radius:14px;margin:15px 0}
label{display:block;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #4b5563;background:#111827;color:white;font-size:16px}
textarea{min-height:110px}
button{padding:13px;border:0;border-radius:9px;background:#f59e0b;color:#111827;font-weight:bold;font-size:16px;margin:8px 4px 0 0}
button:disabled{opacity:.5}
#result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.status{color:#86efac}
</style>
</head>
<body>
<div class="container">
<h1>🎬 MittiRaaz AI Studio</h1>
<p style="text-align:center">Long Video Script & YouTube SEO Assistant</p>

<div class="card">
<h2>पूरी वीडियो बनाएं</h2>

<label>चैनल का नाम</label>
<input id="channel" value="MittiRaaz Story">

<label>कहानी का विषय</label>
<textarea id="idea" placeholder="अपनी कहानी का विषय लिखें..."></textarea>

<label>वीडियो की भाषा</label>
<select id="language">
<option value="Hindi">हिंदी</option>
<option value="English">English</option>
<option value="Hinglish">Hinglish</option>
</select>

<label>वीडियो की कुल लंबाई</label>
<select id="duration">
<option value="5">5 मिनट</option>
<option value="10">10 मिनट</option>
<option value="15" selected>15 मिनट</option>
<option value="20">20 मिनट</option>
<option value="30">30 मिनट</option>
<option value="custom">अपनी पसंद का समय</option>
</select>

<div id="customBox" style="display:none">
<label>कितने मिनट? (1 से 120)</label>
<input id="customDuration" type="number" min="1" max="120" placeholder="जैसे 25">
</div>

<button id="generate">🎬 पूरी वीडियो स्क्रिप्ट बनाएं</button>
<button id="continue" style="display:none">▶️ बाकी Scenes जारी रखें</button>
<button id="save">💾 प्रोजेक्ट सेव करें</button>
<p id="status" class="status">हर Scene 10 सेकंड का होगा।</p>
</div>

<div class="card">
<h2>YouTube SEO</h2>
<button id="seo">🚀 SEO तैयार करें</button>
</div>

<div class="card">
<h2>आपकी पूरी स्क्रिप्ट</h2>
<div id="result">आपका AI Result यहाँ दिखाई देगा।</div>
<button id="copy">📋 Copy Result</button>
</div>
</div>

<script>
const WORKER_URL="https://shiny-silence-623a.bikashbhandarimittiraazstory.workers.dev";
const $=id=>document.getElementById(id);
const STORAGE="mittiraazLongVideoProjectV2";
let project=null;
let busy=false;

$("duration").addEventListener("change",()=>{
  $("customBox").style.display=
    $("duration").value==="custom"?"block":"none";
});

function getDuration(){
  if($("duration").value==="custom"){
    const n=Number($("customDuration").value);
    if(!Number.isInteger(n)||n<1||n>120)
      throw new Error("1 से 120 मिनट के बीच समय डालें।");
    return n;
  }
  return Number($("duration").value);
}

function saveProgress(){
  localStorage.setItem(STORAGE,JSON.stringify(project));
  $("result").textContent=project.output||"";
  $("continue").style.display=
    project && project.nextScene<=project.totalScenes ? "inline-block":"none";
}

async function askAI(prompt){
  const response=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"AI से जवाब नहीं मिला।");
  if(!data.text) throw new Error("AI ने खाली जवाब दिया।");
  return data.text;
}

function characterPrompt(){
return `
आप एक अनुभवी भारतीय कहानी लेखक और AI फिल्म निर्देशक हैं।

चैनल: ${project.channel}
कहानी: ${project.idea}
भाषा: ${project.language}

सबसे पहले पूरी कहानी के सभी मुख्य और सहायक पात्रों की Character Bible बनाएं।
हर पात्र की उम्र, चेहरा, त्वचा का रंग, बाल, शरीर, कपड़े, जूते, गहने, आवाज और बोलने का अंदाज स्पष्ट लिखें।
हर पात्र का नाम और उसका स्थायी रूप तय करें।
कहानी की दुनिया, गाँव, घर और अन्य मुख्य जगहों का रूप भी तय करें।

ये सभी विवरण आगे के हर Scene में बिल्कुल समान रहने चाहिए।
नए Scene में पात्रों का चेहरा, कपड़े, उम्र या आवाज न बदलें।
कहानी का पूरा अंत पहले से सोचें। कहानी में शुरुआत, संघर्ष, सस्पेंस, क्लाइमैक्स और संतोषजनक अंत होना चाहिए।

केवल Character Bible और कहानी का संक्षिप्त पूरा प्लान दें।
अभी Scenes न लिखें।
`;
}

function scenePrompt(start,end){
const total=project.totalScenes;
return `
आप एक प्रोफेशनल YouTube Long Film Script Writer और Google Flow AI Video Prompt Expert हैं।

चैनल: ${project.channel}
कहानी: ${project.idea}
भाषा: ${project.language}
कुल वीडियो अवधि: ${project.minutes} मिनट
कुल Scenes: ${total}
हर Scene की अवधि: बिल्कुल 10 सेकंड।

यह Character Bible और पूरी कहानी का प्लान है:
${project.bible}

अब केवल Scene ${start} से Scene ${end} तक लिखें।
कहानी का क्रम न तोड़ें। पिछले Scenes की घटनाओं को आगे बढ़ाएं।
पूरी कहानी के तय अंत तक पहुंचने की योजना का पालन करें।

बहुत जरूरी नियम:
1. हर Scene बिल्कुल 10 सेकंड का हो।
2. हर Scene के लिए अलग Image Prompt लिखें।
3. हर Scene के लिए अलग Video Prompt लिखें।
4. हर Video Prompt Google Flow में सीधे इस्तेमाल करने लायक हो।
5. हर Video Prompt में 10-second duration, camera movement और character action स्पष्ट हों।
6. हर Scene में आवश्यक Dialogue, Voice-over, Background Music और SFX दें।
7. Dialogue 10 सेकंड में बोले जा सकने जितना ही रखें।
8. पात्रों का चेहरा, शरीर, कपड़े, आवाज और रंग Character Bible के अनुसार समान रखें।
9. एक Scene में जितने पात्र जरूरी हों, केवल उतने ही दिखाएं।
10. Image Prompt और Video Prompt में वही पात्र और वही स्थान हों।
11. कहानी को छोटा करके Scenes कम न करें।
12. कोई Scene छोड़ें नहीं और Scene numbering बिल्कुल सही रखें।
13. हर Scene में कहानी आगे बढ़नी चाहिए। एक ही दृश्य को बार-बार न दोहराएं।
14. Image और Video Prompt विस्तृत, स्पष्ट और उपयोगी हों।
15. Video का aspect ratio 16:9 रखें।

हर Scene का Format:

SCENE NUMBER
समय: 00:00–00:10

Scene में क्या होगा:
दृश्य की छोटी जानकारी।

IMAGE PROMPT:
अंग्रेजी में पूरा visual prompt। Character Bible के अनुसार पात्रों का रूप दोहराएं।

VIDEO PROMPT:
अंग्रेजी में पूरा Google Flow prompt। Exactly 10 seconds, action, expressions, camera movement और continuity निर्देश शामिल हों।

DIALOGUE / VOICE-OVER:
पात्र का नाम और उसका संवाद। जरूरत के अनुसार narration भी।

BACKGROUND MUSIC:
इस Scene के लिए संगीत।

SFX:
आवश्यक ध्वनि प्रभाव।

अब केवल Scene ${start} से ${end} तक लिखें।
आउटपुट में इन Scenes के अलावा कुछ न लिखें।
`;
}

async function runBatches(){
if(busy)return;
busy=true;
$("generate").disabled=true;
$("continue").disabled=true;

try{
  if(!project.bible){
    $("status").textContent="AI पूरी कहानी और Character Bible तैयार कर रहा है...";
    project.bible=await askAI(characterPrompt());
    saveProgress();
  }

  const batchSize=10;

  while(project.nextScene<=project.totalScenes){
    const start=project.nextScene;
    const end=Math.min(start+batchSize-1,project.totalScenes);

    $("status").textContent=
      "AI Scene "+start+" से "+end+" तैयार कर रहा है। कुल "+project.totalScenes+" Scenes हैं।";

    const answer=await askAI(scenePrompt(start,end));

    project.output +=
      "\n\n========================================\n"+
      "SCENES "+start+" TO "+end+
      "\n========================================\n\n"+
      answer;

    project.nextScene=end+1;
    saveProgress();

    $("status").textContent=
      "Scene "+end+" / "+project.totalScenes+" तैयार हो गए।";
  }

  project.completed=true;
  saveProgress();
  $("status").textContent=
    "🎉 पूरी "+project.minutes+" मिनट की स्क्रिप्ट तैयार हो गई! कुल "+project.totalScenes+" Scenes।";

}catch(e){
  $("status").textContent=
    "रुक गया: "+e.message+" । पहले से तैयार Scenes सेव हैं। बाकी के लिए जारी रखें दबाएं।";
}finally{
  busy=false;
  $("generate").disabled=false;
  $("continue").disabled=false;
  $("continue").style.display=
    project && project.nextScene<=project.totalScenes ? "inline-block":"none";
}
}

$("generate").addEventListener("click",()=>{
  const idea=$("idea").value.trim();
  if(!idea){$("status").textContent="पहले कहानी का विषय लिखें।";return;}

  let minutes;
  try{minutes=getDuration();}catch(e){$("status").textContent=e.message;return;}

  const totalScenes=minutes*6;

  project={
    channel:$("channel").value.trim()||"MittiRaaz Story",
    idea,
    language:$("language").value,
    minutes,
    totalScenes,
    nextScene:1,
    bible:"",
    output:"",
    completed:false
  };

  saveProgress();
  runBatches();
});

$("continue").addEventListener("click",()=>{
  if(project)runBatches();
});

$("save").addEventListener("click",()=>{
  if(project)saveProgress();
  const extra={
    channel:$("channel").value,
    idea:$("idea").value,
    language:$("language").value,
    duration:$("duration").value,
    customDuration:$("customDuration").value
  };
  localStorage.setItem("mittiraazForm",JSON.stringify(extra));
  $("status").textContent="प्रोजेक्ट और उपलब्ध स्क्रिप्ट सेव हो गई।";
});

$("seo").addEventListener("click",async()=>{
  const idea=$("idea").value.trim();
  if(!idea){$("status").textContent="पहले वीडियो का विषय लिखें।";return;}
  $("seo").disabled=true;
  $("status").textContent="SEO तैयार हो रहा है...";
  try{
    const prompt=`
YouTube Long Video SEO Expert बनें।
चैनल: ${$("channel").value}
विषय: ${idea}
भाषा: ${$("language").value}
यह Long Video है, Short नहीं।

SEO Title, Description, Keywords, comma-separated Tags,
Hashtags और Thumbnail Text तैयार करें।
`;
    const answer=await askAI(prompt);
    $("result").textContent=answer;
    $("status").textContent="SEO तैयार हो गया।";
  }catch(e){
    $("status").textContent="Error: "+e.message;
  }finally{
    $("seo").disabled=false;
  }
});

$("copy").addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText($("result").textContent);
    $("status").textContent="Copy हो गया।";
  }catch(e){
    $("status").textContent="Result को दबाकर Select All और Copy करें।";
  }
});

try{
  const old=localStorage.getItem(STORAGE);
  if(old){
    project=JSON.parse(old);
    $("result").textContent=project.output||"";
    $("continue").style.display=
      project.nextScene<=project.totalScenes?"inline-block":"none";
  }
  const form=localStorage.getItem("mittiraazForm");
  if(form){
    const p=JSON.parse(form);
    $("channel").value=p.channel||"MittiRaaz Story";
    $("idea").value=p.idea||"";
    $("language").value=p.language||"Hindi";
    $("duration").value=p.duration||"15";
    $("customDuration").value=p.customDuration||"";
    $("customBox").style.display=p.duration==="custom"?"block":"none";
  }
}catch(e){}
</script>
</body>
</html>
